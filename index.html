<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zineb 💙 My Valentine</title>

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#cce7ff,#e6f2ff);
    font-family:'Comic Sans MS',cursive;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    position:relative;
    z-index:2;
}

#bunny{
    width:180px;
    margin-bottom:20px;
}

#proposalText{
    font-size:28px;
    color:#003366;
    margin-bottom:40px;
    transition:0.3s;
}

.buttons{
    position:relative;
    width:400px;
    height:150px;
    margin:auto;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    position:absolute;
    transition:0.2s ease;
    z-index:3;
}

#yesBtn{
    background:#3399ff;
    color:white;
    left:80px;
    top:50px;
}

#noBtn{
    background:#ff4d4d;
    color:white;
    left:200px;
    top:50px;
}

#celebrationText{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:70px;
    color:#002244;
    display:none;
    z-index:10;
    animation:pop 0.6s ease forwards;
}

@keyframes pop{
    0%{transform:translate(-50%,-50%) scale(0);}
    100%{transform:translate(-50%,-50%) scale(1);}
}

.emoji{
    position:fixed;
    font-size:30px;
    animation:floatUp 3s linear forwards;
}

@keyframes floatUp{
    0%{bottom:-50px;opacity:1;}
    100%{bottom:100vh;opacity:0;}
}
</style>
</head>

<body>

<div class="container" id="mainContainer">

    <!-- Clean SVG Bunny -->
    <svg id="bunny" viewBox="0 0 200 200">
        <ellipse cx="60" cy="40" rx="20" ry="45" fill="#ffffff"/>
        <ellipse cx="140" cy="40" rx="20" ry="45" fill="#ffffff"/>
        <ellipse cx="60" cy="40" rx="10" ry="35" fill="#cce7ff"/>
        <ellipse cx="140" cy="40" rx="10" ry="35" fill="#cce7ff"/>
        <circle cx="100" cy="110" r="60" fill="#ffffff"/>
        <circle cx="80" cy="105" r="8" fill="#003366"/>
        <circle cx="120" cy="105" r="8" fill="#003366"/>
        <ellipse cx="100" cy="125" rx="10" ry="6" fill="#ff99aa"/>
    </svg>

    <h1 id="proposalText">
        Zineb 💙 will you make me the happiest boy alive and be my Valentine?
    </h1>

    <div class="buttons">
        <button id="yesBtn">YES 💙</button>
        <button id="noBtn">NO</button>
    </div>
</div>

<div id="celebrationText">
    YEEEEEEAAAAAAY 💙💙💙<br>
    I knew you'd say YES bunny!! 🐰💙
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const proposalText = document.getElementById("proposalText");
const celebrationText = document.getElementById("celebrationText");
const mainContainer = document.getElementById("mainContainer");

const beggingTexts = [
"Pretty please Zineb 🥺💙",
"Come on my bunny 🐰💙",
"I promise unlimited hugs 🤗💙",
"You know you want to say yes 😌💙",
"Don’t break my tiny heart 💙",
"Just click YES alreadyyy 💙"
];

let begIndex = 0;
let yesScale = 1;

noBtn.addEventListener("click", () => {

    // Move NO anywhere in viewport safely
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";

    // YES keeps growing forever
    yesScale += 0.6;
    yesBtn.style.transform = `scale(${yesScale})`;

    proposalText.innerHTML = beggingTexts[begIndex % beggingTexts.length];
    begIndex++;
});

yesBtn.addEventListener("click", () => {

    mainContainer.style.display = "none";
    celebrationText.style.display = "block";

    for(let i=0;i<60;i++){
        const emoji=document.createElement("div");
        emoji.classList.add("emoji");
        emoji.innerHTML=["💙","💙","💋","🤗","🐰"][Math.floor(Math.random()*5)];
        emoji.style.left=Math.random()*100+"vw";
        emoji.style.animationDuration=(2+Math.random()*2)+"s";
        document.body.appendChild(emoji);
        setTimeout(()=>emoji.remove(),4000);
    }
});
</script>

</body>
</html>
